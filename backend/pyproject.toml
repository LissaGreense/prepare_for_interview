[project]
name = "interview-quiz-backend"
version = "0.1.0"
description = "Backend for the local interview-prep quiz app"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "mypy",
]
# AI question-generator (Phase 1: interactive topic scoping). Optional so the
# core quiz app installs without the LangGraph/LLM stack.
gen = [
    "langgraph",
    "langchain-openai",       # ChatOpenAI -> LM Studio's OpenAI-compatible server
    "langchain-anthropic",    # Claude, when QUIZGEN_LLM_PROVIDER=anthropic
    "langchain-community",    # DuckDuckGoSearchResults + WebBaseLoader
    "langchain-text-splitters",
    "ddgs",                   # search backend (free, no key; formerly duckduckgo-search)
    "beautifulsoup4",         # WebBaseLoader HTML parsing
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
# Bare generics (e.g. a un-parameterized CompiledStateGraph) silently expand to
# [Any, ...]; forbid them so that hidden Any can't creep back in.
disallow_any_generics = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
