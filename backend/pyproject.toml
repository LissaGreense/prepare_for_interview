[project]
name = "interview-quiz-backend"
version = "0.1.0"
description = "Backend for the local interview-prep quiz app"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "mypy",
]
# AI question-generator (Phase 1: interactive topic scoping). Optional so the
# core quiz app installs without the LangGraph/LLM stack.
gen = [
    "langgraph",
    "langchain-openai",       # ChatOpenAI -> LM Studio's OpenAI-compatible server
    "langchain-anthropic",    # Claude, when QUIZGEN_LLM_PROVIDER=anthropic
    "langchain-community",    # DuckDuckGoSearchResults + WebBaseLoader
    "langchain-text-splitters",
    "ddgs",                   # search backend (free, no key; formerly duckduckgo-search)
    "beautifulsoup4",         # WebBaseLoader HTML parsing
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
# S = bandit security, RUF = ruff-specific, BLE = blind-except.
select = ["E", "F", "I", "UP", "B", "SIM", "S", "RUF", "BLE"]

[tool.ruff.lint.per-file-ignores]
# `assert` is the idiom in pytest; S101 only matters in shipped code.
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
# Full strict mode. Notably this subsumes disallow_any_generics: bare generics
# (e.g. an un-parameterized CompiledStateGraph) silently expand to [Any, ...];
# forbidding them keeps hidden Any from creeping back in.
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-config"
